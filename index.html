<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex the What</title>
<style>
  :root { --bg: #fff; --fg: #000; --muted: #888; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --fg: #fff; --muted: #777; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 40px 16px; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, Menlo, Consolas, monospace; text-align: center;
  }
  h1 { font-size: 16px; font-weight: normal; margin: 0 0 24px; }
  #swatch { width: 200px; height: 200px; margin: 0 auto; }
  #choices { margin: 24px auto 0; max-width: 300px; }
  #choices button, #inputArea input, #inputArea button, #next {
    font: inherit; font-size: 16px; color: var(--fg); background: none;
    border: 1px solid var(--fg); padding: 8px 12px; margin: 4px; cursor: pointer;
  }
  #choices button:disabled { cursor: default; color: var(--muted); border-color: var(--muted); }
  #choices button.correct { color: var(--fg); border-color: var(--fg); font-weight: bold; }
  #inputArea { margin-top: 24px; }
  #inputArea input { width: 9em; cursor: text; text-transform: uppercase; }
  #result { margin-top: 24px; min-height: 1.4em; }
  #next { margin-top: 12px; }
  #yours { width: 200px; height: 40px; margin: 0 auto; }
  p.small { margin-top: 32px; color: var(--muted); font-size: 13px; }
  a { color: var(--muted); margin: 0 6px; }
  a.on { color: var(--fg); text-decoration: none; }
  #hexLabel { font-size: 40px; margin: 70px 0; }
  #colorChoices { margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 300px; max-width: 100%; }
  #colorChoices button { border: 0; padding: 0; aspect-ratio: 1; cursor: pointer; position: relative; outline-offset: 3px; }
  #colorChoices button:disabled { cursor: default; opacity: .35; }
  #colorChoices button.correct { opacity: 1; outline: 2px solid var(--fg); }
  #colorChoices button.picked { opacity: 1; }
  #colorChoices span { position: absolute; left: 0; right: 0; bottom: -1.5em; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--fg); }
  #colorChoices.revealed { row-gap: 30px; }
</style>
</head>
<body>
<h1>hex the what?</h1>

<div id="swatch"></div>
<div id="hexLabel" hidden></div>
<div id="colorChoices" hidden></div>
<div id="yours" hidden></div>

<div id="choices"></div>

<form id="inputArea" hidden autocomplete="off">
  #<input id="hexInput" maxlength="6" placeholder="RRGGBB" spellcheck="false" aria-label="カラーコード">
  <button type="submit">OK</button>
</form>

<div id="result"></div>
<button id="next" hidden>next</button>

<p class="small">
  score <span id="score">0</span> / streak <span id="streak">0</span><br><br>
  <a href="#" data-mode="choice">color → hex</a>
  <a href="#" data-mode="input">type hex</a>
  <a href="#" data-mode="color">hex → color</a>
</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let mode = 'choice', score = 0, streak = 0, answer, answered = false;

  const rand = n => Math.floor(Math.random() * n);
  const clamp = v => Math.max(0, Math.min(255, v));
  const toHex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  const fromHex = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

  function decoys(base) {
    const out = [];
    for (const s of [48, 64, 90, 120, 160]) {
      let c, t = 0;
      do { c = base.map(v => clamp(v + rand(s * 2 + 1) - s)); t++; }
      while ((dist(c, base) < 30 || out.some(o => dist(o, c) < 30)) && t < 200);
      out.push(c);
    }
    return out;
  }

  function newRound() {
    answer = [rand(256), rand(256), rand(256)];
    answered = false;
    $('swatch').style.background = toHex(answer);
    $('yours').hidden = true;
    $('result').textContent = '';
    $('next').hidden = true;
    if (mode === 'choice') {
      $('choices').innerHTML = '';
      [answer, ...decoys(answer)].sort(() => Math.random() - 0.5).forEach(c => {
        const b = document.createElement('button');
        b.textContent = toHex(c);
        b.onclick = () => pick(b);
        $('choices').appendChild(b);
      });
    } else if (mode === 'color') {
      $('hexLabel').textContent = toHex(answer);
      const area = $('colorChoices');
      area.innerHTML = '';
      area.classList.remove('revealed');
      [answer, ...decoys(answer)].sort(() => Math.random() - 0.5).forEach(c => {
        const b = document.createElement('button');
        b.style.background = b.dataset.hex = toHex(c);
        b.setAttribute('aria-label', 'choice');
        b.onclick = () => pickColor(b);
        area.appendChild(b);
      });
    } else {
      $('hexInput').value = '';
      $('hexInput').disabled = false;
      $('hexInput').focus();
    }
  }

  function done(ok, pts, msg) {
    answered = true;
    score += pts;
    streak = ok ? streak + 1 : 0;
    $('score').textContent = score;
    $('streak').textContent = streak;
    $('result').textContent = msg;
    $('next').hidden = false;
    $('next').focus();
  }

  function pick(btn) {
    if (answered) return;
    const correct = toHex(answer), ok = btn.textContent === correct;
    for (const b of $('choices').children) {
      b.disabled = true;
      if (b.textContent === correct) b.classList.add('correct');
    }
    if (!ok) { $('yours').style.background = btn.textContent; $('yours').hidden = false; }
    done(ok, ok ? 1 : 0, ok ? 'correct' : 'wrong — ' + correct);
  }

  function pickColor(btn) {
    if (answered) return;
    const correct = toHex(answer), ok = btn.dataset.hex === correct;
    $('colorChoices').classList.add('revealed');
    for (const b of $('colorChoices').children) {
      b.disabled = true;
      b.innerHTML = `<span>${b.dataset.hex}</span>`;
      if (b.dataset.hex === correct) b.classList.add('correct');
    }
    btn.classList.add('picked');
    done(ok, ok ? 1 : 0, ok ? 'correct' : 'wrong');
  }

  $('inputArea').onsubmit = e => {
    e.preventDefault();
    if (answered) return newRound();
    const v = $('hexInput').value.trim();
    if (!/^[0-9a-fA-F]{6}$/.test(v)) return;
    const guess = fromHex(v);
    const pts = Math.max(0, Math.round(100 - dist(guess, answer) / 4.42));
    $('hexInput').disabled = true;
    $('yours').style.background = toHex(guess);
    $('yours').hidden = false;
    done(pts >= 90, pts, pts + '/100 — ' + toHex(answer));
  };

  $('hexInput').oninput = e => { e.target.value = e.target.value.replace(/[^0-9a-fA-F]/g, '').slice(0, 6); };
  $('next').onclick = newRound;
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && answered && document.activeElement !== $('next')) { e.preventDefault(); newRound(); }
    if (!answered && ['1', '2', '3', '4', '5', '6'].includes(e.key)) {
      if (mode === 'choice') { const b = $('choices').children[+e.key - 1]; if (b) pick(b); }
      if (mode === 'color') { const b = $('colorChoices').children[+e.key - 1]; if (b) pickColor(b); }
    }
  });

  function setMode(m) {
    mode = m;
    $('choices').hidden = m !== 'choice';
    $('inputArea').hidden = m !== 'input';
    $('swatch').hidden = m === 'color';
    $('hexLabel').hidden = $('colorChoices').hidden = m !== 'color';
    document.querySelectorAll('[data-mode]').forEach(a => a.classList.toggle('on', a.dataset.mode === m));
    streak = 0; $('streak').textContent = 0;
    newRound();
  }
  document.querySelectorAll('[data-mode]').forEach(a => a.onclick = e => { e.preventDefault(); setMode(a.dataset.mode); });
  setMode('choice');
})();
</script>
</body>
</html>
